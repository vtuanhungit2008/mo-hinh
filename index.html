close:{az:0.35,el:0.28,r:2.0,ty:0.95},
mascot:{az:0.15,el:0.2,r:2.8,ty:0.6,tx:1.3}
};
var labels=[['front','Chính diện'],['left','Góc trái'],['right','Góc phải'],['side','Hông phải'],['back','Mặt sau'],['top','Từ trên'],['close','Cận cảnh'],['mascot','Linh vật']];
var bt=document.getElementById('bt'),btns={};
var cur={az:0.6,el:0.2,r:6,ty:1.1,tx:0},tg={az:0,el:0.12,r:4.4,ty:1.1,tx:0},auto=false;
labels.forEach(function(l){
var b=document.createElement('button');b.textContent=l[1];
b.onclick=function(){auto=false;ab.className='';var v=views[l[0]];tg.az=v.az;tg.el=v.el;tg.r=v.r;tg.ty=v.ty;tg.tx=v.tx||0;mark(l[0]);};
bt.appendChild(b);btns[l[0]]=b;
});
var ab=document.createElement('button');ab.textContent='Tự xoay';
ab.onclick=function(){auto=!auto;ab.className=auto?'on':'';if(auto){var v=views.left;tg.el=v.el;tg.r=v.r;tg.ty=v.ty;tg.tx=0;mark('');}};
bt.appendChild(ab);
function mark(k){for(var n in btns)btns[n].className=(n===k)?'on':'';}
mark('front');

var drag=false,lx=0,ly=0;
mount.addEventListener('pointerdown',function(e){drag=true;lx=e.clientX;ly=e.clientY;mount.style.cursor='grabbing';});
window.addEventListener('pointerup',function(){drag=false;mount.style.cursor='grab';});
window.addEventListener('pointermove',function(e){
if(!drag)return;
tg.az-=(e.clientX-lx)*0.008;tg.el+=(e.clientY-ly)*0.006;
tg.el=Math.max(0.02,Math.min(1.45,tg.el));lx=e.clientX;ly=e.clientY;mark('');
});
mount.addEventListener('wheel',function(e){e.preventDefault();tg.r=Math.max(1.5,Math.min(9,tg.r+e.deltaY*0.003));},{passive:false});

function resize(){
var w=Math.min(mount.clientWidth||360,720),h=Math.round(w*0.75);
R.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix();
}
window.addEventListener('resize',resize);resize();

function loop(){
requestAnimationFrame(loop);
if(auto){tg.az+=0.006;}
var k=0.08;
cur.az+=(tg.az-cur.az)*k;cur.el+=(tg.el-cur.el)*k;cur.r+=(tg.r-cur.r)*k;cur.ty+=(tg.ty-cur.ty)*k;cur.tx+=(tg.tx-cur.tx)*k;
cam.position.set(cur.tx+cur.r*Math.cos(cur.el)*Math.sin(cur.az),cur.ty+cur.r*Math.sin(cur.el),cur.r*Math.cos(cur.el)*Math.cos(cur.az));
cam.lookAt(cur.tx,cur.ty,0);
anim();R.render(S,cam);
}
loop();
})();
</script>
</body>
</html>
