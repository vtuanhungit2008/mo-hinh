<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nui phô mai Gia Nguyễn - mô hình 3D</title>
<style>
:root{--bg:#fff3d6;--fg:#3a1f00;--sub:#7a4a10;--btn:#fff;--on:#f6a623;--bd:#e0a040;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#2a1a08;--fg:#ffe9b8;--sub:#d9b26a;--btn:#3b2610;--on:#c9821a;--bd:#7a5420}}
:root[data-theme="dark"]{--bg:#2a1a08;--fg:#ffe9b8;--sub:#d9b26a;--btn:#3b2610;--on:#c9821a;--bd:#7a5420}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;text-align:center;padding:16px}
h1{font-size:22px;margin:8px 0 4px}
p{color:var(--sub);margin:0 0 8px;font-size:14px}
#c{width:100%;max-width:560px;margin:0 auto;touch-action:none;cursor:grab}
#c canvas{display:block;margin:0 auto}
button{font:inherit;font-size:15px;padding:10px 16px;margin:4px;border-radius:999px;border:1px solid var(--bd);background:var(--btn);color:var(--fg);cursor:pointer}
button.on{background:var(--on);color:#2a1200;font-weight:600}
</style>
</head>
<body>
<h1>Nui phô mai Gia Nguyễn</h1>
<p>Kéo để xoay, nhãn tên Gia Nguyễn nằm ở mặt sau tô</p>
<div id="c"></div>
<div>
<button id="b1" class="on">Nui truyền thống</button>
<button id="b2">Nui phô mai cay</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var mount=document.getElementById('c');
var renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});}catch(e){mount.textContent='Trình duyệt không hỗ trợ WebGL.';return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
mount.appendChild(renderer.domElement);
var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(40,1,0.1,100);
camera.position.set(0,3.2,8.2);
camera.lookAt(0,1.3,0);
scene.add(new THREE.AmbientLight(0xffffff,0.7));
var dl=new THREE.DirectionalLight(0xffffff,0.8);dl.position.set(4,8,6);scene.add(dl);
var pl=new THREE.PointLight(0xffb347,0.6);pl.position.set(-5,3,4);scene.add(pl);
var g=new THREE.Group();scene.add(g);
var M=function(c,r){return new THREE.MeshStandardMaterial({color:c,roughness:r==null?0.55:r});};

var shadow=new THREE.Mesh(new THREE.CircleGeometry(2.4,40),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.18}));
shadow.rotation.x=-Math.PI/2;shadow.position.y=-0.02;scene.add(shadow);

var pts=[[0,0],[0.9,0],[1.2,0.15],[1.7,0.9],[1.85,1.3],[1.75,1.3],[1.6,0.9],[1.1,0.25],[0,0.2]].map(function(p){return new THREE.Vector2(p[0],p[1]);});
var bowlMat=M(0xd94f1e,0.4);bowlMat.side=THREE.DoubleSide;
g.add(new THREE.Mesh(new THREE.LatheGeometry(pts,48),bowlMat));

var fill=new THREE.Mesh(new THREE.CylinderGeometry(1.76,1.76,0.1,48),M(0xf4b73c));
fill.position.y=1.25;g.add(fill);
var mound=new THREE.Mesh(new THREE.SphereGeometry(1.6,32,16,0,Math.PI*2,0,Math.PI/2),M(0xf7c04a));
mound.scale.y=0.55;mound.position.y=1.3;g.add(mound);

var pastaMats=[M(0xf5c542),M(0xe9a825),M(0xffd66b)];
var pasta=[];
for(var i=0;i<46;i++){
var r=Math.sqrt(Math.random())*1.4,a=Math.random()*Math.PI*2;
var y=1.3+0.88*Math.sqrt(Math.max(0,1-(r/1.6)*(r/1.6)))+0.04;
var m=new THREE.Mesh(new THREE.TorusGeometry(0.17,0.07,8,16,Math.PI*1.4),pastaMats[i%3]);
m.position.set(Math.cos(a)*r,y,Math.sin(a)*r);
m.rotation.set(Math.random()*6,Math.random()*6,Math.random()*6);
g.add(m);pasta.push(m);
}

var cheeseMat=M(0xffd84d,0.3);
var melt=new THREE.Mesh(new THREE.SphereGeometry(1.2,32,16),cheeseMat);
melt.scale.y=0.22;melt.position.y=2.15;g.add(melt);
[0.2,0.7,2.4,3.0,3.6,4.4,5.2,5.8].forEach(function(an,k){
var h=0.35+0.15*(k%3);
var d=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,h,12),cheeseMat);
d.position.set(Math.cos(an)*1.9,1.2-h/2+0.1,Math.sin(an)*1.9);g.add(d);
var s=new THREE.Mesh(new THREE.SphereGeometry(0.13,12,12),cheeseMat);
s.position.set(Math.cos(an)*1.9,1.3-h,Math.sin(an)*1.9);g.add(s);
});

var cube=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.5,0.7),M(0xffcf33,0.3));
cube.position.set(0.25,2.5,0);cube.rotation.y=0.5;g.add(cube);
[[0.36,0.1,0.1],[0.1,-0.1,0.36],[0.2,0.15,0.36]].forEach(function(p){
var hole=new THREE.Mesh(new THREE.SphereGeometry(0.07,10,10),M(0xe0a800));
hole.position.set(p[0],p[1],p[2]);cube.add(hole);
});

var face=new THREE.Group();face.position.set(0,0.65,0);face.rotation.x=0.3;g.add(face);
[-0.55,0.55].forEach(function(x){
var e=new THREE.Mesh(new THREE.SphereGeometry(0.26,20,20),M(0xffffff,0.3));
e.scale.z=0.5;e.position.set(x,0.2,1.58);face.add(e);
var p=new THREE.Mesh(new THREE.SphereGeometry(0.13,16,16),M(0x111111,0.2));
p.position.set(x,0.2,1.7);face.add(p);
});
var smile=new THREE.Mesh(new THREE.TorusGeometry(0.35,0.045,8,24,Math.PI),M(0x4a1500));
smile.rotation.z=Math.PI;smile.position.set(0,-0.05,1.6);face.add(smile);

var lc=document.createElement('canvas');lc.width=1024;lc.height=190;
var lx2=lc.getContext('2d');
lx2.fillStyle='#fff3d6';lx2.fillRect(0,0,1024,190);
lx2.strokeStyle='#f6a623';lx2.lineWidth=14;lx2.strokeRect(7,7,1010,176);
lx2.fillStyle='#a00000';lx2.textAlign='center';lx2.textBaseline='middle';
lx2.font='bold 64px Arial, sans-serif';lx2.fillText('GIA NGUYỄN',512,70);
lx2.fillStyle='#7a3b00';lx2.font='bold 40px Arial, sans-serif';lx2.fillText('NUI PHÔ MAI - 28K',512,138);
var ltex=new THREE.CanvasTexture(lc);
var label=new THREE.Mesh(new THREE.CylinderGeometry(1.69,1.355,0.5,48,1,true,Math.PI-1.2,2.4),new THREE.MeshStandardMaterial({map:ltex,roughness:0.6,side:THREE.DoubleSide}));
label.position.y=0.6;g.add(label);

var chilis=new THREE.Group();
[[-0.8,0.3],[0.9,-0.4],[0.1,0.9]].forEach(function(p,i){
var c=new THREE.Mesh(new THREE.ConeGeometry(0.12,0.7,12),M(0xd62828,0.3));
c.position.set(p[0],2.55,p[1]);c.rotation.z=1.2+i*0.4;c.rotation.y=i*1.5;chilis.add(c);
var st=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.15,8),M(0x2e7d32));
st.position.set(p[0]+0.3*Math.cos(i),2.62,p[1]);chilis.add(st);
});
chilis.visible=false;g.add(chilis);

function setMode(spicy){
pastaMats[0].color.setHex(spicy?0xe8541c:0xf5c542);
pastaMats[1].color.setHex(spicy?0xc43d12:0xe9a825);
pastaMats[2].color.setHex(spicy?0xf2743a:0xffd66b);
mound.material.color.setHex(spicy?0xe8741f:0xf7c04a);
fill.material.color.setHex(spicy?0xd9601a:0xf4b73c);
chilis.visible=spicy;
b1.className=spicy?'':'on';b2.className=spicy?'on':'';
}
var b1=document.getElementById('b1'),b2=document.getElementById('b2');
b1.onclick=function(){setMode(false);};
b2.onclick=function(){setMode(true);};

var rotY=0.5,drag=false,lx=0;
mount.addEventListener('pointerdown',function(e){drag=true;lx=e.clientX;mount.style.cursor='grabbing';});
window.addEventListener('pointerup',function(){drag=false;mount.style.cursor='grab';});
window.addEventListener('pointermove',function(e){if(drag){rotY+=(e.clientX-lx)*0.01;lx=e.clientX;}});

function resize(){
var w=Math.min(mount.clientWidth||360,560),h=Math.round(w*0.95);
renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);resize();

var t=0;
function loop(){
requestAnimationFrame(loop);
t+=0.016;
if(!drag)rotY+=0.006;
g.rotation.y=rotY;
g.position.y=Math.sin(t*2)*0.05;
renderer.render(scene,camera);
}
loop();
})();
</script>
</body>
</html>
